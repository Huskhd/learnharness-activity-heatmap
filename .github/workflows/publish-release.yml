name: Publish release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Expected version at main HEAD (x.y.z); rerun original run for older commits'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-lifecycle
  cancel-in-progress: false

jobs:
  publish:
    # No publication during bootstrap. Owner enables only after protections/review.
    if: github.ref == 'refs/heads/main' && vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate and package
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/release-guards.test.mjs
          python scripts/package_plugin.py --output-dir release-artifacts
      - name: Publish an approved promoted version idempotently
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ inputs.version }}
