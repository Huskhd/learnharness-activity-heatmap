name: Publish release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Expected version at main HEAD (x.y.z); rerun original run for older commits'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-lifecycle
  cancel-in-progress: false

jobs:
  publish:
    # No publication during bootstrap. Owner enables only after protections/review.
    if: github.ref == 'refs/heads/main' && vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node 24 runtime)
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 (Node 24 runtime)
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate and package
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/release-guards.test.mjs
          python scripts/package_plugin.py --output-dir release-artifacts
      - name: Publish an approved promoted version idempotently
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ inputs.version }}
