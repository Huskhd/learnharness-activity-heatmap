name: Prepare release

# Deliberately manual: owner approval and branch rules must come first.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-lifecycle
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check baseline, synchronization, and pending release labels
        run: node scripts/prepare-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Prepare version and changelog PR into dev (never publish here)
        uses: googleapis/release-please-action@0b6b3fc0186a2f7118bfd88fab9ea481e1839504 # v5.0.0
        with:
          target-branch: dev
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
